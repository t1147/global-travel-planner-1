function getClimateLevel(dest, season) {
  const w = (weatherDB[dest]||weatherDB.default)[season];
  const t = w.temp;
  if(!t||t==='--') return 'temperate';
  const match = t.match(/-?\d+/g);
  if(!match) return 'temperate';
  const avg = match.map(Number).reduce((a,b)=>a+b,0)/match.length;
  if(avg>=28) return 'hot';
  if(avg>=20) return 'warm';
  if(avg>=12) return 'temperate';
  if(avg>=5) return 'cool';
  if(avg>=-5) return 'cold';
  return 'freezing';
}

let generated = false;

function gotoStep(n) {
  if(n>1 && !generated) return;
  [1,2,3,4,5,6].forEach(i => {
    document.getElementById('sec'+i).classList.toggle('active', i===n);
    const st = document.getElementById('st'+i);
    st.classList.toggle('active', i===n);
    st.classList.toggle('done', i<n);
  });
}

// ===== HUMANIZED CLOTHES QUANTITY =====
// Assumes laundry every 4–5 days; caps at realistic max
function humanQty(days, type) {
  if (type === 'underwear' || type === 'sock') {
    // Underwear/socks: change daily, but wash every ~5 days → max ~6–7 for any length trip
    if (days <= 3) return days + '件';
    if (days <= 5) return '5件';
    if (days <= 10) return '6件（每5天可洗一次）';
    return '7件（定期洗衣即可）';
  }
  if (type === 'top_light') {
    // Light tops (t-shirts): 1/day up to 5, then +1 per 4 extra days
    if (days <= 3) return days + '件';
    if (days <= 5) return '5件';
    if (days <= 9) return '6–7件（可洗後重複穿）';
    if (days <= 14) return '7–8件';
    return '8件（長途洗衣安排好即可）';
  }
  if (type === 'top_warm') {
    // Warm/layering tops: can repeat more
    if (days <= 3) return days + '件';
    if (days <= 7) return '3–4件';
    if (days <= 14) return '4–5件';
    return '5件（厚衣可重複穿2–3天）';
  }
  if (type === 'pants') {
    // Pants: can wear 2–3 days each
    if (days <= 4) return '2件';
    if (days <= 7) return '2–3件';
    if (days <= 14) return '3件';
    return '3–4件（牛仔褲可穿多天）';
  }
  // Default: return as-is
  return type;
}

function updateProg() {
  const all = document.querySelectorAll('#luggage-area input[type=checkbox]');
  const checked = document.querySelectorAll('#luggage-area input[type=checkbox]:checked');
  const pct = all.length > 0 ? Math.round(checked.length / all.length * 100) : 0;
  const txt = document.getElementById('prog-txt');
  const fill = document.getElementById('prog-fill');
  if(txt) txt.textContent = `${checked.length} / ${all.length} 項`;
  if(fill) fill.style.width = pct + '%';
}
