<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Travel Planner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --font-sans: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --color-text-primary: #1a1a1a;
  --color-text-secondary: #6b7280;
  --color-background-primary: #ffffff;
  --color-background-secondary: #f9fafb;
  --color-border-secondary: #d1d5db;
  --color-border-tertiary: #e5e7eb;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
}
body { background: #f3f4f6; min-height: 100vh; }
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.app{max-width:720px;margin:0 auto;padding:1.5rem 1rem 3rem;font-family:var(--font-sans,'Segoe UI',sans-serif);color:var(--color-text-primary)}
h2.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.hero{text-align:center;padding:1.5rem 0 1.2rem}
.hero h1{font-size:22px;font-weight:500;margin-bottom:5px}
.hero p{font-size:13px;color:var(--color-text-secondary)}
.step-bar{display:flex;align-items:center;gap:0;margin-bottom:1.5rem}
.step{flex:1;text-align:center;font-size:11px;padding:10px 4px;border-bottom:2px solid var(--color-border-tertiary);color:var(--color-text-secondary);cursor:pointer;transition:all .15s;position:relative}
.step.active{border-bottom-color:#185FA5;color:#185FA5;font-weight:500}
.step.done{border-bottom-color:#639922;color:#639922}
.step i{display:block;font-size:18px;margin-bottom:3px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:15px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title i{font-size:18px;color:#185FA5}
.section{display:none}.section.active{display:block}
label.field-label{font-size:12px;color:var(--color-text-secondary);display:block;margin-bottom:5px;font-weight:500}
select,input[type=number],input[type=text]{width:100%;padding:8px 11px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px}
select:focus,input:focus{outline:none;border-color:#185FA5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--color-background-secondary)}
.btn-primary{background:#185FA5;color:#fff;border-color:#185FA5;width:100%;justify-content:center;padding:11px;font-size:14px;margin-top:10px}
.btn-primary:hover{opacity:.88;background:#185FA5}
.badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.b-blue{background:#E6F1FB;color:#0C447C}.b-green{background:#EAF3DE;color:#27500A}.b-amber{background:#FAEEDA;color:#633806}.b-red{background:#FCEBEB;color:#791F1F}.b-gray{background:#F1EFE8;color:#444441}.b-teal{background:#E1F5EE;color:#085041}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px;gap:12px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--color-text-secondary);flex-shrink:0;min-width:90px}
.info-val{font-weight:500;text-align:right;color:var(--color-text-primary);font-size:12px}
.tip{background:#E6F1FB;border-radius:var(--border-radius-md);padding:10px 13px;font-size:12px;color:#0C447C;margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.warn{background:#FAEEDA;border-radius:var(--border-radius-md);padding:10px 13px;font-size:12px;color:#633806;margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.ok{background:#EAF3DE;border-radius:var(--border-radius-md);padding:10px 13px;font-size:12px;color:#27500A;margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.tip i,.warn i,.ok i{font-size:16px;flex-shrink:0}
.sep{height:0.5px;background:var(--color-border-tertiary);margin:12px 0}
.section-sub{font-size:11px;color:var(--color-text-secondary);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:13px;border-bottom:0.5px solid var(--color-border-tertiary)}
.check-item:last-child{border-bottom:none}
.check-item input[type=checkbox]{width:15px;height:15px;margin-top:2px;accent-color:#185FA5;flex-shrink:0;cursor:pointer}
.check-item label{cursor:pointer;font-size:13px;line-height:1.5}
.sub{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.clothes-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px}
.clothes-row:last-child{border-bottom:none}
.clothes-row .qty{font-size:11px;color:var(--color-text-secondary)}
.prog-wrap{margin-top:14px}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--color-text-secondary);margin-bottom:5px}
.prog-bar{height:5px;background:var(--color-border-tertiary);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:#185FA5;border-radius:3px;transition:width .3s}
.passport-flag{font-size:28px;margin-right:8px;vertical-align:-4px}
.nationality-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.nat-btn{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 8px;text-align:center;cursor:pointer;font-size:12px;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.nat-btn:hover{border-color:#185FA5;background:var(--color-background-primary)}
.nat-btn.selected{border-color:#185FA5;background:#E6F1FB;color:#0C447C;font-weight:500}
.nat-btn .flag{font-size:22px}
.nat-btn .nat-name{font-size:11px}
.tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);font-size:12px;cursor:pointer;color:var(--color-text-secondary);transition:all .15s;display:flex;align-items:center;gap:5px}
.tab i{font-size:15px}
.tab.active{background:#185FA5;color:#fff;border-color:#185FA5}
</style>

</head>
<body>
<div class="app">
<h2 class="sr-only">Global Travel Planner — 選擇國籍後查詢簽證、衣物、行李與當地資訊</h2>

<div class="hero">
  <h1><i class="ti ti-world" aria-hidden="true" style="font-size:22px;vertical-align:-3px;color:#185FA5;margin-right:7px"></i>Global Travel Planner</h1>
  <p>選擇你的國籍 → 設定目的地 → 獲得個人化出行建議 &nbsp;|&nbsp; Select nationality first</p>
</div>

<!-- STEP BAR -->
<div class="step-bar">
  <div class="step active" id="st1" onclick="gotoStep(1)"><i class="ti ti-id" aria-hidden="true"></i>國籍</div>
  <div class="step" id="st2" onclick="gotoStep(2)"><i class="ti ti-map-pin" aria-hidden="true"></i>目的地</div>
  <div class="step" id="st3" onclick="gotoStep(3)"><i class="ti ti-file-certificate" aria-hidden="true"></i>簽證</div>
  <div class="step" id="st4" onclick="gotoStep(4)"><i class="ti ti-shirt" aria-hidden="true"></i>衣物</div>
  <div class="step" id="st5" onclick="gotoStep(5)"><i class="ti ti-luggage" aria-hidden="true"></i>行李</div>
  <div class="step" id="st6" onclick="gotoStep(6)"><i class="ti ti-map-2" aria-hidden="true"></i>當地</div>
</div>

<!-- STEP 1: NATIONALITY -->
<div id="sec1" class="section active">
  <div class="card">
    <div class="card-title"><i class="ti ti-id" aria-hidden="true"></i>選擇你的護照國籍 / Select your passport nationality</div>
    <div class="nationality-grid" id="nat-grid"></div>
    <div class="sep"></div>
    <div class="row2">
      <div>
        <label class="field-label">你的年齡 / Your age</label>
        <input type="number" id="age" min="0" max="120" placeholder="例如 28">
      </div>
      <div>
        <label class="field-label">旅遊目的 / Purpose</label>
        <select id="purpose">
          <option value="tourism">觀光 Tourism</option>
          <option value="business">商務 Business</option>
          <option value="study">留學 Study</option>
          <option value="work">打工度假 Working Holiday</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary" onclick="gotoStep(2)"><i class="ti ti-arrow-right" aria-hidden="true"></i>下一步：選目的地</button>
  </div>
</div>

<!-- STEP 2: DESTINATION -->
<div id="sec2" class="section">
  <div class="card">
    <div class="card-title"><i class="ti ti-map-pin" aria-hidden="true"></i>選擇目的地 / Destination country</div>
    <div class="row2">
      <div>
        <label class="field-label">目的地 / Country</label>
        <select id="dest">
          <option value="">-- 選擇 --</option>
          <optgroup label="🌏 東亞 East Asia">
          <option value="jp">🇯🇵 日本 Japan</option>
          <option value="kr">🇰🇷 韓國 South Korea</option>
          <option value="tw">🇹🇼 台灣 Taiwan</option>

          <option value="mn">🇲🇳 蒙古 Mongolia</option>
          </optgroup>
          <optgroup label="🌏 東南亞 Southeast Asia">
          <option value="sg">🇸🇬 新加坡 Singapore</option>
          <option value="th">🇹🇭 泰國 Thailand</option>
          <option value="vn">🇻🇳 越南 Vietnam</option>
          <option value="ph">🇵🇭 菲律賓 Philippines</option>
          <option value="my">🇲🇾 馬來西亞 Malaysia</option>
          <option value="id">🇮🇩 印尼 Indonesia</option>
          <option value="kh">🇰🇭 柬埔寨 Cambodia</option>
          <option value="la">🇱🇦 寮國 Laos</option>

          <option value="eg">🇪🇬 埃及 Egypt</option>
          <option value="ma">🇲🇦 摩洛哥 Morocco</option>
          <option value="ke">🇰🇪 肯亞 Kenya</option>
          <option value="za">🇿🇦 南非 South Africa</option>
          <option value="tz">🇹🇿 坦尚尼亞 Tanzania</option>
          </optgroup>
          <optgroup label="🌎 北美 North America">
          <option value="us">🇺🇸 美國 USA</option>
          <option value="ca">🇨🇦 加拿大 Canada</option>
          <option value="mx">🇲🇽 墨西哥 Mexico</option>

          </optgroup>
          <optgroup label="🌎 南美 South America">
          <option value="br">🇧🇷 巴西 Brazil</option>

          <option value="uk">🇬🇧 英國 UK</option>

          <option value="nl">🇳🇱 荷蘭 Netherlands</option>
          <option value="ch">🇨🇭 瑞士 Switzerland</option>

          <option value="fi">🇫🇮 芬蘭 Finland</option>
          <option value="ie">🇮🇪 愛爾蘭 Ireland</option>
          <option value="cz">🇨🇿 捷克 Czech Republic</option>
          <option value="hu">🇭🇺 匈牙利 Hungary</option>
          <option value="pl">🇵🇱 波蘭 Poland</option>
          <option value="hr">🇭🇷 克羅埃西亞 Croatia</option>
          </optgroup>
          <optgroup label="🌍 東歐 Eastern Europe">
          <option value="ru">🇷🇺 俄羅斯 Russia</option>
          <option value="tr">🇹🇷 土耳其 Turkey</option>
          </optgroup>
          <optgroup label="🌏 大洋洲 Oceania">
          <option value="au">🇦🇺 澳洲 Australia</option>
          <option value="nz">🇳🇿 紐西蘭 New Zealand</option>

        </select>
      </div>
      <div>
        <label class="field-label">停留天數 / Stay</label>
        <input type="number" id="days" min="1" max="365" placeholder="天">
      </div>
    </div>
    <div class="row2">
      <div>
        <label class="field-label">旅遊季節 / Season</label>
        <select id="season">
          <option value="spring">春 Spring (3–5月)</option>
          <option value="summer">夏 Summer (6–8月)</option>
          <option value="fall">秋 Fall (9–11月)</option>
          <option value="winter">冬 Winter (12–2月)</option>

        <label class="field-label">旅遊類型 / Trip type</label>
        <select id="triptype">
          <option value="casual">一般觀光</option>
          <option value="outdoor">戶外登山</option>

      </div>

    <button class="btn btn-primary" onclick="generateAll()"><i class="ti ti-sparkles" aria-hidden="true"></i>產生完整出行建議</button>
  </div>
</div>

<!-- STEP 3: VISA -->
<div id="sec3" class="section">
  <div id="visa-area"></div>
</div>

<!-- STEP 4: CLOTHES -->
<div id="sec4" class="section">
  <div id="clothes-area"></div>
</div>

<!-- STEP 5: LUGGAGE -->
<div id="sec5" class="section">
  <div id="luggage-area"></div>
</div>

<!-- STEP 6: LOCAL -->
<div id="sec6" class="section">
  <div id="local-area"></div>
</div>

</div>

<script>
// ===== NATIONALITY DATA =====
const nationalities = [
  {code:'tw',flag:'🇹🇼',name:'台灣',en:'Taiwan'},
  {code:'jp',flag:'🇯🇵',name:'日本',en:'Japan'},
  {code:'kr',flag:'🇰🇷',name:'韓國',en:'Korea'},
  {code:'hk',flag:'🇭🇰',name:'香港',en:'HK'},
  {code:'cn',flag:'🇨🇳',name:'中國',en:'China'},
  {code:'sg',flag:'🇸🇬',name:'新加坡',en:'Singapore'},
  {code:'us',flag:'🇺🇸',name:'美國',en:'USA'},
  {code:'uk',flag:'🇬🇧',name:'英國',en:'UK'},
  {code:'de',flag:'🇩🇪',name:'德國',en:'Germany'},
  {code:'fr',flag:'🇫🇷',name:'法國',en:'France'},
  {code:'au',flag:'🇦🇺',name:'澳洲',en:'Australia'},
  {code:'ca',flag:'🇨🇦',name:'加拿大',en:'Canada'},
  {code:'in',flag:'🇮🇳',name:'印度',en:'India'},
  {code:'ph',flag:'🇵🇭',name:'菲律賓',en:'Philippines'},
  {code:'vn',flag:'🇻🇳',name:'越南',en:'Vietnam'},
  {code:'th',flag:'🇹🇭',name:'泰國',en:'Thailand'},
  {code:'my',flag:'🇲🇾',name:'馬來西亞',en:'Malaysia'},
  {code:'id',flag:'🇮🇩',name:'印尼',en:'Indonesia'},

// ===== VISA DATABASE =====
// Structure: visaDB[passportCode][destinationCode] = {status, note, days, eta, cost, timeline, whv}
// status: 'visa-free'|'eta'|'evisa'|'visa-required'|'restricted'
const visaDB = {
  tw:{
    jp:{status:'visa-free',days:90,note:'免簽 90 天，無需任何電子授權',timeline:['護照效期 ≥6 個月（出發前確認）','購買旅遊保險（建議）','兌換日幣或申請 IC 卡','訂好 eSIM / SIM 卡'],whv:{avail:true,age:'18–30',note:'可申請打工度假，向日本交流協會申請，備存款 NT$10萬+'}},
    kr:{status:'visa-free',days:90,note:'免簽 90 天',timeline:['護照效期 ≥6 個月','K-ETA 部分情況需申辦','購買旅遊保險','備妥 T-money 卡計畫'],whv:{avail:true,age:'18–30',note:'向駐台韓國代表部申請，財力證明需備'}},
    us:{status:'eta',days:90,note:'ESTA 電子旅行授權，費用 USD 21，90 天',eta:'https://esta.cbp.dhs.gov',timeline:['ESTA 申辦（出發前至少 72 小時）','護照效期需在離境後仍有效','旅遊保險（美國醫療極貴）','告知銀行出國刷卡'],whv:{avail:false,note:'台灣目前無美國 Working Holiday 協議'}},
    uk:{status:'visa-free',days:180,note:'6 個月免簽（電子旅行授權 ETA 自 2025 年起需申辦，GBP 10）',timeline:['英國 ETA 申辦（出發前）','護照效期確認','旅遊保險','兌換英鎊'],whv:{avail:true,age:'18–30',note:'英國 YMS 青年交流計畫，向英國在台辦事處申請'}},

    fr:{status:'visa-free',days:90,note:'申根區免簽，同德國規則',timeline:['申根保險','護照效期','天數計算'],whv:{avail:true,age:'18–30',note:'法台 WHV，向法國在台協會申請'}},

function getClimateLevel(dest, season) {
  const w = (weatherDB[dest]||weatherDB.default)[season];
  const t = w.temp;
  if(!t||t==='--') return 'temperate';
  const match = t.match(/-?\d+/g);
  if(!match) return 'temperate';
  const avg = match.map(Number).reduce((a,b)=>a+b,0)/match.length;
  if(avg>=28) return 'hot';
  if(avg>=20) return 'warm';
  if(avg>=12) return 'temperate';
  if(avg>=5) return 'cool';
  if(avg>=-5) return 'cold';
  return 'freezing';
}

  mo:{currency:'澳門幣 MOP / 港幣 HKD',socket:'G/D型 (220V)',emergency:'999/112',tips:['交通：各大賭場免費接駁巴士，從碼頭出發','賭場：澳門賭場收入超越拉斯維加斯，但管制嚴格','美食：葡式蛋撻/豬扒包/非洲雞，必嘗葡亞融合料理','世界遺產：大三巴牌坊/媽閣廟/路氹填海區','路氹：路氹城是新賭場區，度假設施齊全','語言：廣東話+葡語+普通話，觀光區多語言']},
  mn:{currency:'蒙古圖格里克 MNT',socket:'C/E型 (220V)',emergency:'102/103',tips:['遊牧體驗：蒙古包（Ger）住宿是最道地體驗，7–8月草原最美','那達慕節：7月11–13日，摔跤/射箭/賽馬傳統盛典','戈壁沙漠：南部戈壁沙漠，駱駝騎乘+峽谷地貌','換匯：烏蘭巴托市區換匯，ATM 有 Visa 提款','語言：蒙古語+俄語，年輕人有英語','基礎設施：道路差，越野車旅遊為主，需嚮導']},
  default:{currency:'查詢目的地官方資料',socket:'建議攜帶萬用轉接頭',emergency:'當地緊急電話',tips:['提前查詢目的地官方旅遊資訊','購買旅遊保險','確認護照效期','了解當地文化與禁忌']}

function getLocalInfo(dest) {

// ===== STATE =====
let selectedNat = '';
let generated = false;

// ===== INIT NATIONALITY GRID =====
function initNatGrid() {
  const grid = document.getElementById('nat-grid');
  grid.innerHTML = nationalities.map(n => `<div class="nat-btn" id="nat-${n.code}" onclick="selectNat('${n.code}')"><span class="flag">${n.flag}</span><span class="nat-name">${n.name}<br><span style="color:var(--color-text-secondary);font-size:10px">${n.en}</span></span></div>`).join('');
}

function selectNat(code) {
  selectedNat = code;
  document.querySelectorAll('.nat-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('nat-'+code).classList.add('selected');
}

function gotoStep(n) {
  if(n>2 && !generated) return;
  [1,2,3,4,5,6].forEach(i => {
    document.getElementById('sec'+i).classList.toggle('active', i===n);
    const st = document.getElementById('st'+i);
    st.classList.toggle('active', i===n);
    st.classList.toggle('done', i<n);
  });
}

// ===== HUMANIZED CLOTHES QUANTITY =====
// Assumes laundry every 4–5 days; caps at realistic max
function humanQty(days, type) {
  if (type === 'underwear' || type === 'sock') {
    // Underwear/socks: change daily, but wash every ~5 days → max ~6–7 for any length trip
    if (days <= 3) return days + '件';
    if (days <= 5) return '5件';
    if (days <= 10) return '6件（每5天可洗一次）';
    return '7件（定期洗衣即可）';
  }
  if (type === 'top_light') {
    // Light tops (t-shirts): 1/day up to 5, then +1 per 4 extra days
    if (days <= 3) return days + '件';
    if (days <= 5) return '5件';
    if (days <= 9) return '6–7件（可洗後重複穿）';
    if (days <= 14) return '7–8件';
    return '8件（長途洗衣安排好即可）';
  }
  if (type === 'top_warm') {
    // Warm/layering tops: can repeat more
    if (days <= 3) return days + '件';
    if (days <= 7) return '3–4件';
    if (days <= 14) return '4–5件';
    return '5件（厚衣可重複穿2–3天）';
  }
  if (type === 'pants') {
    // Pants: can wear 2–3 days each
    if (days <= 4) return '2件';
    if (days <= 7) return '2–3件';
    if (days <= 14) return '3件';
    return '3–4件（牛仔褲可穿多天）';
  }
  // Default: return as-is
  return type;
}

function generateAll() {
  const dest = document.getElementById('dest').value;
  if(!dest) { alert('請選擇目的地！'); return; }
  if(!selectedNat) { alert('請先選擇你的國籍！'); return; }
  const age = parseInt(document.getElementById('age').value)||0;
  const purpose = document.getElementById('purpose').value;
  const days = parseInt(document.getElementById('days').value)||7;
  const season = document.getElementById('season').value;
  const triptype = document.getElementById('triptype').value;
  const natInfo = nationalities.find(n=>n.code===selectedNat);
  const destSel = document.getElementById('dest');
  const destName = destSel.options[destSel.selectedIndex].text;

  // === VISA ===
  const v = getVisa(selectedNat, dest);
  const statusMap = {
    'visa-free':{label:'免簽 Visa-Free',cls:'b-green'},
    'eta':{label:'電子授權 ETA',cls:'b-blue'},
    'evisa':{label:'電子簽 e-Visa',cls:'b-teal'},
    'visa-required':{label:'需簽證 Visa Required',cls:'b-red'},
    'visa-on-arrival':{label:'落地簽 VoA',cls:'b-amber'},
    'restricted':{label:'特殊規定',cls:'b-amber'},
    'check':{label:'請查詢 Check Official',cls:'b-gray'},
    'home':{label:'本國',cls:'b-gray'}
  };
  const vs = statusMap[v.status]||statusMap.check;
  let visaHtml = `<div class="card">
    <div class="card-title"><i class="ti ti-file-certificate" aria-hidden="true"></i>簽證資訊 — ${natInfo.flag}${natInfo.name} → ${destName}</div>
    <div class="info-row"><span class="info-label">簽證類型</span><span class="info-val"><span class="badge ${vs.cls}">${vs.label}</span></span></div>
    <div class="info-row"><span class="info-label">免簽天數上限</span><span class="info-val">${v.days>0?v.days+'天':'—'}</span></div>
    <div class="info-row"><span class="info-label">說明</span><span class="info-val">${v.note}</span></div>`;
  if(days>0 && v.days>0) {
    const ok = days<=v.days;
    visaHtml += `<div class="${ok?'ok':'warn'}"><i class="ti ti-${ok?'circle-check':'alert-triangle'}" aria-hidden="true"></i>${ok?`計畫停留 ${days} 天，符合規定（上限 ${v.days} 天）`:`計畫停留 ${days} 天，超過上限 ${v.days} 天！請申請正式簽證。`}</div>`;
  }
  visaHtml += `</div>`;
  if(v.timeline && v.timeline.length) {
    visaHtml += `<div class="card"><div class="card-title"><i class="ti ti-clock" aria-hidden="true"></i>出發前準備時程</div>`;
    v.timeline.forEach(t => { visaHtml += `<div class="info-row"><span class="info-label" style="color:var(--color-text-primary)"><i class="ti ti-circle-check" aria-hidden="true" style="font-size:14px;color:#639922;margin-right:6px"></i>${t}</span></div>`; });
    visaHtml += `</div>`;
  }
  if(age>0) {
    let ageHtml = '';
    if(age<18) {
      ageHtml = `<div class="card"><div class="card-title"><i class="ti ti-user" aria-hidden="true"></i>年齡特別規定（${age} 歲，未成年）</div>
        <div class="warn"><i class="ti ti-alert-triangle" aria-hidden="true"></i>未滿 18 歲：護照需監護人協辦；單獨出行需備妥父母公證同意書；建議攜帶英文出生證明</div></div>`;
    } else if(age>=65) {
      ageHtml = `<div class="card"><div class="card-title"><i class="ti ti-heart" aria-hidden="true"></i>年齡建議（${age} 歲）</div>
        <div class="tip"><i class="ti ti-info-circle" aria-hidden="true"></i>65+ 建議：含緊急醫療遣返的旅遊保險；慢性病藥物多備 1 週；出發前旅遊醫學門診評估</div></div>`;
    } else if(v.whv && v.whv.avail && purpose==='work') {
      ageHtml = `<div class="card"><div class="card-title"><i class="ti ti-star" aria-hidden="true"></i>打工度假（Working Holiday）</div>
        <div class="${age>=18&&age<=30?'ok':'warn'}"><i class="ti ti-${age>=18&&age<=30?'circle-check':'alert-triangle'}" aria-hidden="true"></i>${age>=18&&age<=30?`你（${age}歲）符合 ${v.whv.age} 歲資格！${v.whv.note}`:`你目前 ${age} 歲，請確認是否符合 ${v.whv.age} 歲限制。${v.whv.note}`}</div></div>`;
    }
    visaHtml += ageHtml;
  }
  document.getElementById('visa-area').innerHTML = visaHtml;

  // === CLOTHES ===
  const wKey = weatherDB[dest] ? dest : 'default';
  const weather = (weatherDB[wKey]||weatherDB.default)[season];
  const level = getClimateLevel(wKey, season);
  const clothes = clothesSuggestions[level];
  const seasonNames = {spring:'春季',summer:'夏季',fall:'秋季',winter:'冬季'};
  const levelNames = {hot:'熱帶',warm:'溫暖',temperate:'溫帶',cool:'涼爽',cold:'寒冷',freezing:'極寒'};
  let clothesHtml = `<div class="card"><div class="card-title"><i class="ti ti-thermometer" aria-hidden="true"></i>${destName} ${seasonNames[season]}天氣</div>
    <div class="info-row"><span class="info-label">氣溫範圍</span><span class="info-val" style="font-size:15px;font-weight:500">${weather.temp}</span></div>
    <div class="info-row"><span class="info-label">氣候描述</span><span class="info-val">${weather.desc}</span></div>
    <div class="info-row"><span class="info-label">衣物建議等級</span><span class="info-val"><span class="badge b-blue">${levelNames[level]}穿搭</span></span></div>
  </div>`;
  clothesHtml += `<div class="card"><div class="card-title"><i class="ti ti-shirt" aria-hidden="true"></i>衣物清單（${days} 天旅程）</div>`;
  // Laundry tip
  const laundryTip = days <= 4
    ? `<div class="tip"><i class="ti ti-info-circle" aria-hidden="true"></i>短途旅程（${days} 天），通常不需洗衣，依天數準備即可。</div>`
    : days <= 7
    ? `<div class="tip"><i class="ti ti-info-circle" aria-hidden="true"></i>旅程 ${days} 天，建議行程中找一次洗衣服機會（飯店/自助洗衣），即可輕裝出行。</div>`
    : `<div class="tip"><i class="ti ti-info-circle" aria-hidden="true"></i>旅程超過 ${days} 天，建議每 5–7 天洗衣一次（飯店洗衣服務 / 自助洗衣房），以下數量已依洗衣頻率計算，無需帶太多！</div>`;
  clothesHtml += laundryTip;
  clothes.items.forEach(item => {
    let qty;
    if (item.q === 'fixed') {
      qty = item.v;
    } else {
      qty = humanQty(days, item.t);
    }
    clothesHtml += `<div class="clothes-row"><span>${item.n}</span><span class="qty">${qty}</span></div>`;
  });
  if(triptype==='outdoor') clothesHtml += `<div class="sep"></div><div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:8px;font-weight:500">戶外額外裝備</div><div class="clothes-row"><span>防水登山鞋（Gore-Tex）</span><span class="qty">1雙</span></div><div class="clothes-row"><span>快乾排汗底層</span><span class="qty">${humanQty(days,'top_light')}（快乾衣）</span></div><div class="clothes-row"><span>頭燈 + 登山杖</span><span class="qty">必備</span></div>`;
  if(triptype==='beach') clothesHtml += `<div class="sep"></div><div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:8px;font-weight:500">海灘額外裝備</div><div class="clothes-row"><span>泳裝（備用組）</span><span class="qty">×2套</span></div><div class="clothes-row"><span>防曬外袍/沙龍</span><span class="qty">×1</span></div>`;
  if(triptype==='business') clothesHtml += `<div class="sep"></div><div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:8px;font-weight:500">商務額外裝備</div><div class="clothes-row"><span>正式西裝/套裝</span><span class="qty">必備</span></div><div class="clothes-row"><span>正式皮鞋</span><span class="qty">×1雙</span></div>`;
  if(clothes.extras && clothes.extras.length) {
    clothesHtml += `<div class="sep"></div><div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:8px;font-weight:500">相關必備品</div><div style="display:flex;flex-wrap:wrap;gap:6px">`;
    clothes.extras.forEach(e => { clothesHtml += `<span class="badge b-blue">${e}</span>`; });
    clothesHtml += `</div>`;
  }
  clothesHtml += `</div>`;
  document.getElementById('clothes-area').innerHTML = clothesHtml;

  // === LUGGAGE ===
  const luggageSections = {
    '證件類':[['護照（效期確認）','建議掃描備份至雲端'],['簽證/ETA/ESTA/電子授權','列印紙本+電子版雙備'],['回程機票確認','部分國家入境必查'],['住宿訂單確認','Booking/Airbnb 確認信'],['旅遊保險保單','含緊急援助電話'],['海外駕照/國際駕照','需自駕時']],
    '科技裝備':[['萬用轉接頭（100–240V）','GaN 快充優先'],['行動電源 ≤100Wh','符合 ICAO 航空規定'],['充電線 Type-C/Lightning','備份一條'],['eSIM / 當地 SIM 卡','提前在台灣設定'],['耳機（降噪）','長途飛行必備'],['相機 + 備用電池','選配']],
    '盥洗衛生':[['牙刷 + 牙膏','旅行小包裝'],['洗面乳/沐浴乳','≤100ml（液體限制）'],['護膚乳液/防曬乳','≤100ml'],['隱形眼鏡 + 藥水','多備一組鏡片'],['除臭劑','≤100ml'],['衛生用品','視個人需求']],
    '健康醫療':[['腸胃藥/感冒藥/止痛藥','含中英文藥名'],['過敏藥（抗組織胺）','部分地區花粉嚴重'],['暈車/暈船藥','視需求'],['消毒棉片','小傷口處理'],['個人慢性病藥物','英文診斷書 + 多備 1 週'],['旅遊醫學疫苗記錄','部分地區需要']],
    '財務金融':[['信用卡（Visa/Mastercard）','通知銀行出國，備 2 張'],['當地現金（少量備用）','抵達後換 1–2 天用量'],['海外提款卡','確認 PLUS/Cirrus 網路'],['緊急備用現金 USD 100+','分開存放'],['數位錢包設定','Apple Pay/Google Pay']]
  };
  let lugHtml = `<div class="card"><div class="card-title"><i class="ti ti-luggage" aria-hidden="true"></i>出行行李清單 Packing List</div><p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:14px">勾選已準備的項目 / Check items as you pack</p>`;
  let totalItems = 0;
  Object.entries(luggageSections).forEach(([cat, items]) => {
    lugHtml += `<div class="section-sub" style="margin-top:12px">${cat}</div>`;
    items.forEach(([name, hint], i) => {
      totalItems++;
      lugHtml += `<div class="check-item"><input type="checkbox" id="lug-${cat}-${i}" onchange="updateProg()"><label for="lug-${cat}-${i}">${name}${hint?`<div class="sub">${hint}</div>`:''}</label></div>`;
    });
    lugHtml += `<div class="sep"></div>`;
  });
  lugHtml += `<div class="prog-wrap"><div class="prog-label"><span>準備進度</span><span id="prog-txt">0 / ${totalItems} 項</span></div><div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div></div></div>`;
  document.getElementById('luggage-area').innerHTML = lugHtml;

  // === LOCAL ===
  const local = getLocalInfo(dest);
  let localHtml = `<div class="card"><div class="card-title"><i class="ti ti-map-2" aria-hidden="true"></i>當地必備資訊 — ${destName}</div>
    <div class="info-row"><span class="info-label">當地貨幣</span><span class="info-val">${local.currency}</span></div>
    <div class="info-row"><span class="info-label">插座/電壓</span><span class="info-val">${local.socket}</span></div>
    <div class="info-row"><span class="info-label">緊急電話</span><span class="info-val">${local.emergency}</span></div>
  </div>`;
  localHtml += `<div class="card"><div class="card-title"><i class="ti ti-bulb" aria-hidden="true"></i>在地知識與注意事項</div>`;
  local.tips.forEach(tip => {
    localHtml += `<div class="check-item" style="align-items:flex-start"><i class="ti ti-circle-dot" aria-hidden="true" style="font-size:14px;color:#185FA5;flex-shrink:0;margin-top:3px"></i><label style="cursor:default">${tip}</label></div>`;
  });
  localHtml += `</div>`;
  document.getElementById('local-area').innerHTML = localHtml;

  generated = true;
  gotoStep(3);
}

function updateProg() {
  const all = document.querySelectorAll('#luggage-area input[type=checkbox]');
  const checked = document.querySelectorAll('#luggage-area input[type=checkbox]:checked');
  const pct = all.length > 0 ? Math.round(checked.length / all.length * 100) : 0;
  const txt = document.getElementById('prog-txt');
  const fill = document.getElementById('prog-fill');
  if(txt) txt.textContent = `${checked.length} / ${all.length} 項`;
  if(fill) fill.style.width = pct + '%';
}

initNatGrid();
